<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Favorites | Student Laptop Finder</title>
    <link rel="stylesheet" href="dist/output.css" />
    <script src="src/js/theme-init.js"></script>
  </head>
  <body class="flex min-h-screen flex-col">
    <header id="site-header" class="sticky top-0 z-20 border-b border-line bg-surface"></header>

    <main class="mx-auto w-full max-w-6xl flex-1 px-4 py-8">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <h1 class="text-3xl font-extrabold">Your favorites</h1>
        <button id="clear-all" type="button" class="btn-outline" disabled>Clear all</button>
      </div>
      <div id="summary" class="my-6 grid gap-4 sm:grid-cols-3"></div>
      <div id="favorites-grid" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3"></div>
    </main>

    <footer id="site-footer" class="border-t border-line bg-surface py-6 text-center text-sm text-muted"></footer>

    <script type="module" src="src/js/favorites.js"></script>
  </body>
</html>
