<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Laptop details | Student Laptop Finder</title>
    <link rel="stylesheet" href="dist/output.css" />
    <script src="src/js/theme-init.js"></script>
  </head>
  <body class="flex min-h-screen flex-col">
    <header id="site-header" class="sticky top-0 z-20 border-b border-line bg-surface"></header>

    <main class="mx-auto w-full max-w-6xl flex-1 px-4 py-8">
      <div id="details">
        <div class="grid animate-pulse gap-8 lg:grid-cols-2" aria-hidden="true">
          <div class="aspect-4/3 rounded-xl bg-line"></div>
          <div class="space-y-4">
            <div class="h-4 w-1/4 rounded bg-line"></div>
            <div class="h-9 w-3/4 rounded bg-line"></div>
            <div class="h-10 w-1/3 rounded bg-line"></div>
            <div class="h-20 rounded bg-line"></div>
          </div>
        </div>
      </div>
    </main>

    <footer id="site-footer" class="border-t border-line bg-surface py-6 text-center text-sm text-muted"></footer>

    <script type="module" src="src/js/details.js"></script>
  </body>
</html>
